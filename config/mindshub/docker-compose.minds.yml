services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: mindshub-api
    restart: unless-stopped
    environment:
      COWORK_SERVER_HOST: "0.0.0.0"
      COWORK_SERVER_PORT: "26866"
      DATABASE_URI: "sqlite:////home/cowork/.cowork/cowork.db"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - cowork-data:/home/cowork/.cowork
    networks:
      - mindshub-net

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: mindshub-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mindshub-net

volumes:
  cowork-data:
    driver: local

networks:
  mindshub-net:
    driver: bridge
